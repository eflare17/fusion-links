<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Ops Detailing · PPF 3D</title>
<style>
/* Same look as the 3D tint viewer: black section, orange accent, Russo One headings, Jost body, light studio stage */
:root{
  --bg:#000000;
  --stage-hi:#f6f7f8;
  --stage-lo:#b8bcc1;
  --fg:#ffffff;
  --muted:#aaaaaa;
  --line:#2a2a2a;
  --panel:#151515;
  --chip:#222222;
  --accent:#f07a22;
  --on-accent:#ffffff;
  --film:#38b6ff;
  --r:999px;--r2:12px;--r3:14px;
  --hweight:400;--hcase:uppercase;--hspace:1px;
  --display:"Russo One","Jost",Futura,sans-serif;
  --body:"Jost",Futura,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.app{min-height:100%;display:grid;grid-template-rows:auto auto auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;gap:12px;align-content:start}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:64px;width:auto;flex:none}
.brand .tt{display:flex;flex-direction:column;gap:6px;min-width:0}
.phone{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;letter-spacing:.04em;
  border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;white-space:nowrap}
.phone svg{color:var(--accent)}
@media (max-width:560px){.brand img{height:48px}.phone{padding:7px 11px;font-size:13px}}
h1{font-family:var(--display);font-weight:var(--hweight);font-size:clamp(26px,4vw,40px);letter-spacing:var(--hspace);color:var(--title,var(--accent));line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{font-size:14px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

#stage{position:relative;border-radius:var(--r3);overflow:hidden;min-height:0;height:62vh;min-height:340px;
  background:radial-gradient(120% 90% at 50% 35%,var(--stage-hi),var(--stage-lo))}
/* car stays on screen while the settings scroll */
.app.live #stage{position:sticky;top:0;z-index:5;box-shadow:0 0 0 14px var(--bg)}
@media (min-width:900px){
  .app{grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);grid-template-rows:auto 1fr;column-gap:20px;align-items:start}
  header{grid-column:1/-1}
  #stage{height:calc(100vh - 110px);min-height:420px}
  .app.live #stage{top:14px;box-shadow:none}
  .zones{grid-template-columns:1fr 1fr}
}
#stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#stage canvas.over{cursor:pointer}
.hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:#5d636a;pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:#4f555b;pointer-events:none}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.go3d{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:9px;
  appearance:none;border:0;border-radius:var(--r);padding:13px 22px;background:var(--accent);color:var(--on-accent);
  font:500 17px/1 var(--body);letter-spacing:.02em;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
.go3d:hover{filter:brightness(1.12)}
.go3d:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app:not(.live) .live-only{display:none!important}
.app.live .poster,.app.live .go3d{display:none}
.app:not(.live) #stage{cursor:pointer}
.studio-tunnel #stage{background:#0b0c0d}
.studio-tunnel .hint{color:#8a9196}
.studio-tunnel .loading{color:#9aa1a6}

/* stage overlays */
.tag{position:absolute;left:12px;top:12px;max-width:calc(100% - 24px);display:flex;flex-direction:column;gap:2px;
  background:#ffffff;color:#111;border-radius:var(--r2);padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:none;
  transition:opacity .25s}
.tag b{font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.tag b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--film);box-shadow:0 0 8px var(--film)}
.tag span{font-size:12.5px;color:#4a4f55}
.tag.off{opacity:0}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tools button{appearance:none;border:0;border-radius:var(--r);background:#ffffff;color:#111;font:500 13px/1 var(--body);
  padding:9px 13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);white-space:nowrap}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tools button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* price bar */
.bar{border-radius:var(--r2)!important;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.total{display:flex;flex-direction:column;gap:2px;min-width:0}
.total .label{margin:0}
.amount{font-family:var(--display);font-size:28px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.picked{font-size:13px;color:var(--muted);max-width:60ch}
.quote{appearance:none;border:0;border-radius:var(--r);padding:13px 22px;background:var(--accent);color:var(--on-accent);
  font:600 16px/1 var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.quote:hover{filter:brightness(1.12)}
.quote:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.quote[aria-disabled="true"]{opacity:.45;pointer-events:none}

.label{font-family:var(--display);font-weight:var(--hweight);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pack{appearance:none;text-align:left;border:2px solid var(--line);border-radius:var(--r2);background:var(--panel);color:var(--fg);
  padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-family:var(--body)}
.pack b{font-weight:600;font-size:15px}
.pack span{font-size:12.5px;color:var(--muted);line-height:1.3}
.pack em{font-style:normal;font-size:14px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.pack[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pack:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.zbtn{appearance:none;border:1px solid var(--line);border-radius:var(--r2);background:var(--chip);color:var(--fg);
  padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;font:500 14px/1.2 var(--body);text-align:left}
.zbtn .box{flex:none;width:18px;height:18px;border-radius:5px;border:2px solid #555;display:grid;place-items:center}
.zbtn .nm{flex:1;min-width:0}
.zbtn .pr{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.zbtn[aria-pressed="true"]{border-color:var(--film);background:#10202b}
.zbtn[aria-pressed="true"] .box{border-color:var(--film);background:var(--film)}
.zbtn[aria-pressed="true"] .box::after{content:"";width:5px;height:9px;border:solid #001018;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.zbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zbtn.focus{box-shadow:0 0 0 2px var(--film)}

.rail{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;margin-top:4px}
.group{display:flex;flex-direction:column;gap:5px;min-width:0}
.seg{display:inline-flex;background:var(--chip);border-radius:var(--r);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);font:500 14px/1 var(--body);
  padding:9px 14px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.seg button:hover{background:#333}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.sw-any{background:conic-gradient(#e33,#e9b31d,#4c4,#2bd,#33e,#c3c,#e33)!important}
.anycol{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.anycol input[type=range]{-webkit-appearance:none;appearance:none;width:200px;max-width:100%;height:14px;border-radius:999px;outline:none;cursor:pointer}
.anycol .hue{background:linear-gradient(90deg,#f33,#f93,#ee3,#3c3,#3cc,#36f,#93f,#f3c,#f33)}
.anycol .light{background:linear-gradient(90deg,#111,var(--anymid,#3a6ea5),#eee)}
.anycol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.anycol input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.note{font-size:12.5px;color:var(--muted);max-width:75ch;margin:10px 0 0}
.note b{color:var(--accent);font-weight:600}
.disclaim{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13.5px;line-height:1.4}
.disclaim b{font-weight:600;color:var(--accent)}
@media (max-width:560px){
  #stage{height:46vh;min-height:270px}
  .app.live #stage{border-radius:0 0 14px 14px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
  .seg button{padding:8px 10px;font-size:13px}
  .tools{top:auto;bottom:10px;left:10px;right:10px;flex-direction:row;justify-content:flex-end;flex-wrap:wrap}
  .tools button{padding:8px 11px;font-size:12px}
  .hint{display:none}
  .tag{right:12px}
  .amount{font-size:24px}
  .zones{grid-template-columns:1fr 1fr}
  .zbtn{padding:9px 9px;font-size:13px;gap:8px}
  .zbtn .pr{display:none}
}
html.embedded,html.embedded body{height:auto;background:transparent}
html.embedded .app{max-width:1240px;margin:0 auto;min-height:0;grid-template-rows:auto auto auto}
html.embedded #stage{aspect-ratio:16/9;min-height:300px;max-height:640px;width:100%}
@media (max-width:560px){html.embedded #stage{aspect-ratio:4/5}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><img id="brand-logo" alt="" hidden><div class="tt"><h1 id="brand-title">Paint protection in 3D</h1><span class="sub" id="brand-sub">Tap a panel to see the film</span></div></div>
    <a class="phone" id="brand-phone" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg><span id="brand-phone-text"></span></a>
  </header>

  <div id="stage">
    <img class="poster" src="poster.jpg?v=2" alt="Ford Ranger dual cab with paint protection film zones highlighted" width="1600" height="900" onerror="this.remove()">
    <button class="go3d" id="go3d" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 2.3 5.7 3.2L12 11.7 6.3 8.5 12 5.3ZM6 10.2l5 2.8v5.6l-5-2.8v-5.6Zm7 8.4V13l5-2.8v5.6l-5 2.8Z" fill="currentColor"/></svg>Build your PPF package</button>
    <div class="loading" id="loading" hidden>Loading… 0%</div>
    <div class="tag live-only off" id="tag" role="status" aria-live="polite"><b id="tag-name">Bonnet</b><span id="tag-info"></span></div>
    <div class="tools live-only">
      <button type="button" id="btn-doors" aria-pressed="false">Open doors</button>
      <button type="button" id="btn-tail" aria-pressed="false">Drop tailgate</button>
      <button type="button" id="btn-reset">Reset view</button>
      <button type="button" id="btn-sound" aria-pressed="false" hidden>Sound off</button>
    </div>
    <div class="hint live-only" id="hint">Tap a panel to add it · drag to orbit · pinch to zoom</div>
  </div>

  <div>
    <div class="live-only">
      <div class="bar">
        <div class="total"><span class="label">Estimate</span><span class="amount" id="amount">$0</span><span class="picked" id="picked">Pick a package or tap panels on the car.</span></div>
        <a class="quote" id="quote" href="#" aria-disabled="true">Get a quote</a>
      </div>

      <div class="section"><span class="label">Packages</span><div class="packs" id="packs"></div></div>
      <div class="section"><span class="label">Panels</span><div class="zones" id="zones"></div></div>

      <div class="rail">
        <div class="group"><span class="label">Paint</span>
          <div class="seg" data-key="paint">
            <button id="paint-arctic" data-v="arctic" aria-pressed="false"><i class="sw" style="background:#d9dad6"></i>Arctic White</button>
            <button id="paint-aluminium" data-v="aluminium" aria-pressed="false"><i class="sw" style="background:#a3a7ab"></i>Aluminium</button>
            <button id="paint-meteor" data-v="meteor" aria-pressed="true"><i class="sw" style="background:#4a4e53"></i>Meteor Grey</button>
            <button id="paint-shadow" data-v="shadow" aria-pressed="false"><i class="sw" style="background:#141518"></i>Shadow Black</button>
            <button id="paint-blue" data-v="blue" aria-pressed="false"><i class="sw" style="background:#21497f"></i>Blue Lightning</button>
            <button id="paint-custom" data-v="custom" aria-pressed="false"><i class="sw sw-any" id="sw-any"></i>Any colour</button>
          </div></div>
        <div class="group anycol" id="anycol" hidden>
          <label class="label" for="any-hue">Colour</label>
          <input type="range" id="any-hue" min="0" max="360" value="205" class="hue">
          <label class="label" for="any-light">Light / dark</label>
          <input type="range" id="any-light" min="6" max="85" value="38" class="light">
        </div>
        <div class="group"><span class="label">Spin</span>
          <div class="seg" data-key="spin">
            <button id="spin-on" data-v="on" aria-pressed="false">On</button>
            <button id="spin-off" data-v="off" aria-pressed="true">Off</button>
          </div></div>
      </div>
    </div>
    <p class="note" id="brand-note"></p>
  </div>
</div>

<script>
/* =====================================================================
   EDIT HERE — brand, prices, packages, quote link
   ===================================================================== */
const BRAND = {
  name:     'Black Ops Detailing',
  logo:     'logo.png',                 // image file next to this page ('' = no logo)
  title:    'Paint protection in 3D',
  sub:      'Build your PPF package · Shepparton',
  phone:    '0428 222 762',             // '' = hide
  accent:   '#c8ff00',                  // buttons + highlights
  onAccent: '#0a0a0a',                  // text on accent buttons
  bg:       '#0a0a0a',
  titleColour: '#fafafa',
  display:  'ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
  body:     'ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif',
  headingWeight: 800, headingSpacing: '0',
  round:    'square',                   // 'pill' or 'square'
  studio:   'tunnel',                   // 'light' = grey studio, 'tunnel' = dark workshop with LED light tunnel + intro
  note:     '<b>For illustration only.</b> Prices are estimates and coverage varies by vehicle. Book a consult at our Shepparton studio and we\'ll walk you through the film on your car.'
};
const PRICES = {               // AUD, per zone (both sides where there are two)
  bonnet_full:    800,
  bonnet_partial: 400,
  bumper:         900,
  guards:         500,
  mirrors:        150,
  headlights:     200,
  door_cups:       80,
  door_edges:     120,
  sills:          250,
  tailgate_top:   150,
  body:          4500          // rest of the body (doors, roof, pillars, tub sides, tailgate)
};
const PACKAGES = [             // price: fixed package price (set to null to just add up the zones)
  {id:'partial', name:'Partial Front',    info:'Bumper, bonnet leading edge, mirrors, headlights', price:1450,
   zones:['bumper','bonnet_partial','mirrors','headlights']},
  {id:'full',    name:'Full Front',       info:'Bumper, full bonnet, guards, mirrors, headlights', price:2290,
   zones:['bumper','bonnet_full','guards','mirrors','headlights']},
  {id:'doors',   name:'Door Protection',  info:'Door cups, door edges, door sills', price:400,
   zones:['door_cups','door_edges','sills']},
  {id:'track',   name:'Track Pack / Full Body', info:'Every painted panel plus lights', price:6990,
   zones:['bumper','bonnet_full','guards','mirrors','headlights','door_cups','door_edges','sills','tailgate_top','body']}
];
const QUOTE_URL = 'https://blackopsdetailing.com.au/#/contact';   // where "Get a quote" goes
const QUOTE_ADD_DETAILS = false;                               // add the picked zones + estimate to the link
const FILM_COLOUR = '#38b6ff';                                   // highlight colour for the film
/* ===================================================================== */

(function applyBrand(){const r=document.documentElement.style,B=BRAND;
  r.setProperty('--accent',B.accent);r.setProperty('--on-accent',B.onAccent);r.setProperty('--bg',B.bg);if(B.titleColour)r.setProperty('--title',B.titleColour);
  r.setProperty('--display',B.display);r.setProperty('--body',B.body);r.setProperty('--hweight',B.headingWeight);r.setProperty('--hspace',B.headingSpacing);
  if(B.round==='square'){r.setProperty('--r','3px');r.setProperty('--r2','4px');r.setProperty('--r3','6px');}
  document.title=B.name+' · PPF 3D';
  if(B.studio==='tunnel')document.documentElement.classList.add('studio-tunnel');
  document.getElementById('brand-title').textContent=B.title;document.getElementById('brand-sub').textContent=B.sub;
  const L=document.getElementById('brand-logo');if(B.logo){L.src=B.logo;L.alt=B.name;L.hidden=false;}
  const P=document.getElementById('brand-phone');if(B.phone){P.hidden=false;P.href='tel:'+B.phone.replace(/\s/g,'');document.getElementById('brand-phone-text').textContent=B.phone;}
  document.getElementById('brand-note').innerHTML=B.note;
})();

const ZONES = [
  // id, name, info line, parts (model part names), optional regions, camera view, door state
  {id:'bonnet_full',    name:'Bonnet (full)',        info:'Whole bonnet, edges wrapped',              parts:['clay_bonnet'], view:'bonnet', excl:['bonnet_partial']},
  {id:'bonnet_partial', name:'Bonnet leading edge',  info:'Front 450 mm of the bonnet, where chips hit', parts:['clay_bonnet'], view:'bonnet', excl:['bonnet_full'],
   regions:{clay_bonnet:[[2.12,0,-2,9,9,2]]}, edge:true},
  {id:'bumper',         name:'Front bumper',         info:'Full front bumper',                       parts:['clay_bumper'], view:'bumper'},
  {id:'guards',         name:'Front guards',         info:'Both front guards',                        parts:['clay_guard_l','clay_guard_r'], view:'guards'},
  {id:'mirrors',        name:'Mirrors',              info:'Both mirror caps',                         parts:['clay_mirror_fl','clay_mirror_fr'], view:'mirrors', doors:false},
  {id:'headlights',     name:'Headlights',           info:'Both headlight lenses',                    parts:['lens_headlight_l','lens_headlight_r'], view:'headlights'},
  {id:'door_cups',      name:'Door cups',            info:'Behind all 4 door handles (fingernail scratches)', view:'cups', doors:false,
   parts:['clay_door_fl','clay_door_fr','clay_door_rl','clay_door_rr'],
   regions:{clay_door_f:[[0.14,1.065,0.78,0.43,1.175,1.2],[0.14,1.065,-1.2,0.43,1.175,-0.78]],
            clay_door_r:[[-0.755,1.085,0.76,-0.465,1.195,1.2],[-0.755,1.085,-1.2,-0.465,1.195,-0.76]]}, round:0.04},
  {id:'door_edges',     name:'Door edges',           info:'Rear edge of all 4 doors (door-ding chips)', view:'edges', doors:true,
   parts:['clay_door_fl','clay_door_fr','clay_door_rl','clay_door_rr'],
   regions:{clay_door_f:[[-1,0.3,-2,0.085,1.27,2]], clay_door_r:[[-2,0.3,-2,-0.775,1.29,2]]}},
  {id:'sills',          name:'Door sills',           info:'Sill tops and rockers where feet scuff',  view:'sills', doors:true,
   parts:['clay'], regions:{clay:[[-0.84,0.36,0.70,1.13,0.57,1.0],[-0.84,0.36,-1.0,1.13,0.57,-0.70]]}},
  {id:'tailgate_top',   name:'Tailgate top',         info:'Top edge of the tailgate where loads slide', view:'tailgate',
   parts:['clay_tailgate'], regions:{clay_tailgate:[[-3,1.19,-2,-2.3,2,2]]}},
  {id:'body',           name:'Rest of body',         info:'Doors, roof, pillars, tub sides, tailgate', view:'body', doors:false,

/* ---------- pricing ---------- */
const money=n=>'$'+Math.round(n).toLocaleString('en-AU');
function priceOf(sel){
  // best price: use any package fully inside the selection at its package price, add the rest at zone prices
  let best={total:[...sel].reduce((a,z)=>a+(PRICES[z]||0),0),packs:[]};
  const packs=PACKAGES.filter(p=>p.price!=null&&p.zones.every(z=>sel.has(z)));
  const n=packs.length;
  for(let m=1;m<(1<<n);m++){
    const used=new Set();let ok=true,total=0,names=[];
    for(let i=0;i<n;i++)if(m&(1<<i)){const p=packs[i];if(p.zones.some(z=>used.has(z))){ok=false;break;}p.zones.forEach(z=>used.add(z));total+=p.price;names.push(p.name);}
    if(!ok)continue;
    sel.forEach(z=>{if(!used.has(z))total+=PRICES[z]||0;});
    if(total<best.total)best={total,packs:names};
  }
  return best;
}

function pickPackage(p){
  const on=p.zones.every(z=>selected.has(z))&&p.zones.length===selected.size;

function toggleZone(id,fromList){

/* film highlight: glossy blue sheen, clipped to each zone's region, with a sweep when it's first picked */
const filmVS=`
uniform mat4 uRest;
varying vec3 vRest;varying vec3 vN;varying vec3 vV;
void main(){
  vRest=(uRest*vec4(position,1.0)).xyz;
  vec4 mv=modelViewMatrix*vec4(position,1.0);
  vN=normalize(normalMatrix*normal);vV=-mv.xyz;
  gl_Position=projectionMatrix*mv;
}`;
const filmFS=`
uniform vec3 uCol;uniform float uTime;uniform float uPulse;uniform float uAlpha;
uniform int uN;uniform vec3 uMin[4];uniform vec3 uMax[4];uniform float uR;
varying vec3 vRest;varying vec3 vN;varying vec3 vV;
void main(){
  float edge=1.0;
  if(uN>0){
    float d=1e5;
    for(int i=0;i<4;i++){ if(i>=uN)break;
      vec3 c=(uMin[i]+uMax[i])*0.5;vec3 h=(uMax[i]-uMin[i])*0.5-vec3(uR);
      vec3 q=abs(vRest-c)-h;d=min(d,length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-uR);}
    if(d>0.0)discard;
    edge=smoothstep(0.0,0.012,-d);
  }
  vec3 N=normalize(vN);if(!gl_FrontFacing)N=-N;
  float fr=pow(1.0-clamp(abs(dot(N,normalize(vV))),0.0,1.0),2.0);
  float sweep=smoothstep(0.09,0.0,abs(fract(vRest.x*0.45+vRest.y*0.25-uTime*0.6)-0.5))*uPulse;
  float rim=1.0-edge;
  vec3 c=mix(uCol,vec3(1.0),clamp(fr*0.55+sweep*0.7+rim*0.6,0.0,1.0));
  float a=uAlpha*(0.34+0.5*fr)+sweep*0.35+rim*0.45;
  gl_FragColor=vec4(c,clamp(a,0.0,0.92));
}`;

const parts={};          // part name -> mesh
const overlays=[];       // {zone, mesh, mat}
const doorGroups={};     // door_fl / door_fr / door_rl / door_rr / tailgate -> {pivot, axis, open, cur, target}

const nm=o=>(o.name||'').toLowerCase().replace(/_m(_\d+)?$/,'');
const gl=new T.GLTFLoader();if(window.MeshoptDecoder)gl.setMeshoptDecoder(MeshoptDecoder);
gl.load('ranger-ppf.glb?v=1',g=>{
  const meshes=[];
  g.scene.traverse(o=>{if(o.isMesh)meshes.push(o);});
  meshes.forEach(o=>{const n=nm(o);
    if(n.indexOf('badge')===0){const tx=o.material.map;if(tx){tx.encoding=T.sRGBEncoding;tx.anisotropy=8;}
      o.material=new T.MeshPhysicalMaterial({map:tx,roughness:.25,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:.8,side:T.DoubleSide});o.castShadow=true;}
    else{const hit=MAT[n]?n:Object.keys(MAT).find(m=>n.indexOf(m)===0);o.material=MAT[hit||'clay'];
      if(GLASS.includes(hit)){o.renderOrder=2;o.castShadow=false;}else o.castShadow=true;o.receiveShadow=true;}
    if(!parts[n])parts[n]=o;
  });
  scene.add(g.scene);scene.updateMatrixWorld(true);

  // film overlays (made while everything is still in its closed "rest" position)
  const film=col(FILM_COLOUR);
  ZONES.forEach(z=>z.parts.forEach(pn=>{const m=parts[pn];if(!m)return;
    let regs=null;if(z.regions)for(const k in z.regions)if(pn===k||pn.indexOf(k)===0)regs=z.regions[k];
    if(z.regions&&!regs)return;
    const mins=[],maxs=[];for(let i=0;i<4;i++){const r=regs&&regs[i];mins.push(new T.Vector3(...(r?r.slice(0,3):[0,0,0])));maxs.push(new T.Vector3(...(r?r.slice(3):[0,0,0])));}
    const mat=new T.ShaderMaterial({vertexShader:filmVS,fragmentShader:filmFS,transparent:true,depthWrite:false,side:T.DoubleSide,
      polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,
      uniforms:{uRest:{value:m.matrixWorld.clone()},uCol:{value:film},uTime:{value:0},uPulse:{value:0},uAlpha:{value:1},
        uN:{value:regs?regs.length:0},uMin:{value:mins},uMax:{value:maxs},uR:{value:z.round||0.008}}});
    const ov=new T.Mesh(m.geometry,mat);ov.renderOrder=3;ov.visible=false;ov.raycast=()=>{};
    m.add(ov);overlays.push({zone:z.id,mesh:ov,mat,part:pn});
  }));

  // hinges: doors swing on their front edge, tailgate drops on its bottom edge
  const groupOf=n=>{let m=n.match(/_(door|mirror)_([fr][lr])$/);if(m)return 'door_'+m[2];if(/_tailgate$/.test(n))return 'tailgate';return null;};
  const members={};meshes.forEach(o=>{const k=groupOf(nm(o));if(k)(members[k]=members[k]||[]).push(o);});
  const v=new T.Vector3();
  for(const k in members){
    const b=new T.Box3();
    members[k].forEach(o=>{const pa=o.geometry.attributes.position,ix=o.geometry.index;const n=ix?ix.count:pa.count;
      for(let q=0;q<n;q+=3){v.fromBufferAttribute(pa,ix?ix.getX(q):q).applyMatrix4(o.matrixWorld);b.expandByPoint(v);}});

    else{const right=k.endsWith('r');piv.position.set(b.max.x,(b.min.y+b.max.y)/2,right?b.max.z-0.05:b.min.z+0.05);axis='y';open=(right?1:-1)*1.1;}
    scene.add(piv);scene.updateMatrixWorld(true);members[k].forEach(o=>piv.attach(o));
    doorGroups[k]={pivot:piv,axis,open,cur:0,target:0};
  }
  loadingEl.remove();
  if(STUDIO)startIntro();
  window.PPF3D.ready=true;sync();
  if(selected.size){const last=ZONES.find(z=>selected.has(z.id));flyTo(last.view,last.doors);}
},x=>{if(x.total)loadingEl.textContent='Loading… '+Math.round(x.loaded/x.total*100)+'%';},
()=>{loadingEl.textContent='The 3D model failed to load. Refresh to try again.';});

/* ---------- studio intro: lights switch on back to front, camera sweeps round ---------- */
let intro=null,sceneMats=[];

function setLevel(v){sceneMats.forEach(m=>{m.envMapIntensity=m.userData.baseEnv*v;});hemi.intensity=.25*v;key.intensity=.45*v;tunnel.setRoom(.12+.88*v);}
function startIntro(){
  if(!tunnel)return;

function introFrame(dt){
  intro.t+=Math.min(dt,1/30);const t=Math.max(intro.t,0),n=tunnel.count;
  let lit=0;

    if(t>=ti){if(!intro.fired.has(i)){intro.fired.add(i);SFX.clunk();SFX.humTo(.035*(i+1)/n,.15);}
      v=t<ti+.05?1:t<ti+.12?.12:t<ti+.16?.8:1;}
    tunnel.setArch(i,v);lit+=Math.min(v,1);}
  setLevel(.06+.94*Math.pow(lit/n,1.3));
  const A={p:new T.Vector3(9.3,1.0,0.5),t:new T.Vector3(0,0.9,0)},B={p:new T.Vector3(7.6,1.1,1.0),t:new T.Vector3(0,0.9,0)};
  if(t<2.9){const k=ease(Math.min(t/2.9,1));camera.position.lerpVectors(A.p,B.p,k);controls.target.copy(A.t);}
  else{
    if(!intro.whoosh){intro.whoosh=true;SFX.whoosh(1.9);}
    const k=ease(Math.min((t-2.9)/1.9,1)),H=VIEWS.home,ht=new T.Vector3(...H.t);
    const from=B.p.clone().sub(B.t),to=new T.Vector3(...H.p).sub(ht);
    const a0=Math.atan2(from.x,from.z),a1=Math.atan2(to.x,to.z),r0=from.length(),r1=to.length(),p0=Math.acos(from.y/r0),p1=Math.acos(to.y/r1);
    const az=a0+(a1-a0)*k,po=p0+(p1-p0)*k,r=r0+(r1-r0)*k,tg=B.t.clone().lerp(ht,k);
    camera.position.set(tg.x+r*Math.sin(po)*Math.sin(az),tg.y+r*Math.cos(po),tg.z+r*Math.sin(po)*Math.cos(az));controls.target.copy(tg);
    if(t>4.5&&!intro.shine){intro.shine=true;SFX.shimmer();}
    if(t>=4.8)finishIntro(true);
  }
}
const soundBtn=document.getElementById('btn-sound');
if(STUDIO){soundBtn.hidden=false;controls.maxDistance=8.9;
  soundBtn.addEventListener('click',()=>{const m=!SFX.muted;SFX.mute(m);soundBtn.setAttribute('aria-pressed',m?'true':'false');soundBtn.textContent=m?'Sound on':'Sound off';});}

/* selection -> overlays */
let pulseZone=null,pulseT0=0;
function sync(){overlays.forEach(o=>{o.mesh.visible=selected.has(o.zone);});}
function pulse(id){pulseZone=id;pulseT0=performance.now();}

/* doors */
function setDoors(open){['door_fl','door_fr','door_rl','door_rr'].forEach(k=>{if(doorGroups[k])doorGroups[k].target=open?1:0;});
  document.getElementById('btn-doors').setAttribute('aria-pressed',open?'true':'false');

document.getElementById('btn-reset').addEventListener('click',()=>{setDoors(false);setTail(false);flyTo('home');showTag(null);});

/* camera fly-to */
let tween=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(view,doors){
  if(intro)finishIntro(true);
  if(doors===true)setDoors(true);else if(doors===false)setDoors(false);
  const V=VIEWS[view]||VIEWS.home;
  const tp=new T.Vector3(...V.p),tt=new T.Vector3(...V.t);
  // keep the camera on whichever side of the car the customer is already looking at
  if(view!=='home'&&camera.position.z<-0.5){tp.z*=-1;tt.z*=-1;}
  const narrow=camera.aspect<1;if(narrow){tp.sub(tt).multiplyScalar(1.25).add(tt);}
  controls.autoRotate=false;
  if(reduce){camera.position.copy(tp);controls.target.copy(tt);return;}
  tween={from:camera.position.clone(),to:tp,fromT:controls.target.clone(),toT:tt,t0:performance.now(),d:900};

const tagEl=document.getElementById('tag');

/* tap a panel */
const ray=new T.Raycaster(),ptr=new T.Vector2();
let down=null;
function pickAt(e){
  const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ptr,camera);
  const pickable=Object.values(parts).filter(m=>ZONES.some(z=>z.parts.includes(nm(m))));
  const hits=ray.intersectObjects(Object.values(parts).filter(m=>m.visible),false);
  if(!hits.length||!pickable.includes(hits[0].object))return null;
  const h=hits[0],pn=nm(h.object);
  // hit point back in the closed "rest" position, so regions still work with doors open
  const ov=overlays.find(o=>o.part===pn);if(!ov)return null;
  const rest=h.object.worldToLocal(h.point.clone()).applyMatrix4(ov.mat.uniforms.uRest.value);
  for(const id of PICK_ORDER){const z=ZONES.find(x=>x.id===id);if(!z.parts.includes(pn))continue;
    let regs=null;if(z.regions){for(const k in z.regions)if(pn===k||pn.indexOf(k)===0)regs=z.regions[k];if(!regs)continue;
      if(!regs.some(b=>rest.x>=b[0]&&rest.y>=b[1]&&rest.z>=b[2]&&rest.x<=b[3]&&rest.y<=b[4]&&rest.z<=b[5]))continue;}
    return id;}
  return null;
}
canvas.addEventListener('pointerdown',e=>{if(intro){finishIntro();down=null;return;}down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);const dt=performance.now()-down.t;down=null;
  if(moved>7||dt>600)return;
  let id=pickAt(e);if(!id)return;
  // doors / roof / tub: just explain, so one tap on a door doesn't add the whole body
  if(id==='body'){showTag({name:'Doors, roof & tub',info:'Covered in Track Pack / Full Body, or add "Rest of body" below'});return;}
  // tapping the bonnet with the leading edge already picked upgrades to the full bonnet
  if(id==='bonnet_partial'&&selected.has('bonnet_full'))id='bonnet_full';
  else if(id==='bonnet_full'&&selected.has('bonnet_partial'))id='bonnet_full';
  toggleZone(id,false);});
let hoverRaf=0;
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||down)return;cancelAnimationFrame(hoverRaf);
  hoverRaf=requestAnimationFrame(()=>canvas.classList.toggle('over',!!pickAt(e)));});
controls.addEventListener('start',()=>{tween=null;});

/* paint / spin */
const state={paint:'meteor',spin:'off'};
function anyHex(){const h=+document.getElementById('any-hue').value,l=+document.getElementById('any-light').value/100;
  const sat=l<.12||l>.8?.25:.62;return '#'+new T.Color().setHSL(h/360,sat,l).getHexString();}
function apply(){if(state.paint==='custom')PAINT.custom.c=anyHex();
  document.getElementById('anycol').hidden=state.paint!=='custom';
  const mid='#'+new T.Color().setHSL(+document.getElementById('any-hue').value/360,.62,.42).getHexString();
  document.getElementById('anycol').style.setProperty('--anymid',mid);document.getElementById('sw-any').style.boxShadow=state.paint==='custom'?'0 0 0 2px '+PAINT.custom.c:'';
  const pt=PAINT[state.paint];MAT.clay.color.copy(col(pt.c));
  MAT.clay.metalness=pt.m>0?pt.m+.2:.05;MAT.clay.roughness=pt.m>0?.36:.42;
  controls.autoRotate=state.spin==='on';}
document.querySelectorAll('.seg[data-key]').forEach(seg=>{
  seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state[seg.dataset.key]=b.dataset.v;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));apply();});});
['any-hue','any-light'].forEach(id=>document.getElementById(id).addEventListener('input',apply));
apply();

controls.target.set(...VIEWS.home.t);camera.position.set(...VIEWS.home.p);
function resize(){const r=stage.getBoundingClientRect();const w=Math.max(r.width,1),h=Math.max(r.height,1);
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<1?42:30;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
let last=performance.now();
function loop(now){requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,0.05);last=now;
  if(intro)introFrame(dt);
  if(tween){const t=ease(Math.min((now-tween.t0)/tween.d,1));
    camera.position.lerpVectors(tween.from,tween.to,t);controls.target.lerpVectors(tween.fromT,tween.toT,t);if(t>=1)tween=null;}
  for(const k in doorGroups){const d=doorGroups[k];if(d.cur!==d.target){
    const step=dt/(reduce?0.001:0.7);d.cur=d.target>d.cur?Math.min(d.target,d.cur+step):Math.max(d.target,d.cur-step);
    d.pivot.rotation[d.axis]=d.open*ease(d.cur);}}
  const pt=(now-pulseT0)/1000;
  overlays.forEach(o=>{const u=o.mat.uniforms;u.uTime.value=now/1000;
    const p=o.zone===pulseZone?Math.max(0,1-pt/2.2):0;u.uPulse.value=p;u.uAlpha.value=o.zone===focusId?1:0.8;});
  if(intro)camera.lookAt(controls.target);else controls.update();
  if(tunnel)tunnel.fade(camera,controls.target);
  renderer.render(scene,camera);}
requestAnimationFrame(loop);

window.PPF3D={sync,flyTo,showTag,pulse,ready:false,setDoors,setTail,skipIntro:()=>finishIntro(),_intro:()=>intro};
}


/* =====================================================================
   DARK WORKSHOP + LED LIGHT TUNNEL (BRAND.studio = 'tunnel')
   ===================================================================== */
function buildTunnel(T,scene,renderer){
  const PI=Math.PI,col=h=>new T.Color(h).convertSRGBToLinear();
  const TUBE='#e4f8ff';
  const ARCH_X=[-3.9,-2.6,-1.3,0,1.3,2.6,3.9];          // tunnel runs along the car, back to front
  const PROFILE=[[-2.25,0.05],[-2.25,2.0],[-1.35,2.9],[1.35,2.9],[2.25,2.0],[2.25,0.05]]; // [z,y] of one frame
  scene.background=col('#0b0c0d');scene.fog=new T.Fog(col('#0b0c0d'),11,26);

  // canvas textures: polished concrete + chequer plate
  const cv=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=8;return t;};
  const concrete=cv(512,512,(g,w,h)=>{g.fillStyle='#4a4b47';g.fillRect(0,0,w,h);
    for(let i=0;i<9000;i++){const v=60+Math.random()*30|0;g.fillStyle='rgba('+v+','+v+','+(v-4)+','+(Math.random()*.25)+')';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
    for(let i=0;i<26;i++){const x=Math.random()*w,y=Math.random()*h,r=30+Math.random()*90,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(20,20,18,.18)');gr.addColorStop(1,'rgba(20,20,18,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);}});
  concrete.repeat.set(7,7);concrete.encoding=T.sRGBEncoding;
  const plateDraw=(g,w,h,bump)=>{g.fillStyle=bump?'#000':'#2c2e30';g.fillRect(0,0,w,h);
    const n=8,cw=w/n;for(let j=0;j<n*2;j++)for(let i=0;i<n;i++){const x=(i+(j%2?.5:0))*cw,y=j*cw/2;
      g.save();g.translate(x+cw/2,y+cw/4);g.rotate((j%2?1:-1)*0.6);
      if(bump){g.fillStyle='#fff';}else{const gr=g.createLinearGradient(-12,0,12,0);gr.addColorStop(0,'#55585b');gr.addColorStop(1,'#1e2022');g.fillStyle=gr;}
      g.beginPath();g.ellipse(0,0,cw*.36,cw*.07,0,0,PI*2);g.fill();g.restore();}};
  const plate=cv(256,256,(g,w,h)=>plateDraw(g,w,h,false)),plateB=cv(256,256,(g,w,h)=>plateDraw(g,w,h,true));
  plate.encoding=T.sRGBEncoding;plate.repeat.set(4,8);plateB.repeat.set(4,8);

  const floorMat=new T.MeshStandardMaterial({map:concrete,color:col('#9a9a95'),roughness:.42,metalness:.15,envMapIntensity:.6});
  const floor=new T.Mesh(new T.PlaneGeometry(40,40),floorMat);floor.rotation.x=-PI/2;floor.receiveShadow=true;scene.add(floor);
  const matMat=new T.MeshStandardMaterial({map:plate,bumpMap:plateB,bumpScale:.012,roughness:.35,metalness:.7,envMapIntensity:.9});
  const mat=new T.Mesh(new T.PlaneGeometry(6.8,3.4),matMat);mat.rotation.x=-PI/2;mat.position.y=.003;mat.receiveShadow=true;scene.add(mat);

  // room shell
  const wall=(w,h,x,y,z,ry,rx,c,e)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshStandardMaterial({color:col(c),roughness:.92,emissive:col(c),emissiveIntensity:e}));
    m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,0);m.receiveShadow=true;scene.add(m);return m.material;};
  const walls=[wall(20,5.2,-8.6,2.6,0,PI/2,0,'#6e6b61',.22),wall(20,5.2,10,2.6,0,-PI/2,0,'#1d1e1f',.15),
    wall(20,5.2,0,2.6,-7.6,0,0,'#2a2b2c',.15),wall(20,5.2,0,2.6,7.6,PI,0,'#2a2b2c',.15),wall(20,16,0,5.2,0,0,PI/2,'#141516',.2)];
  // roof purlins + a couple of dim high-bay lights
  const pur=new T.MeshStandardMaterial({color:col('#3a3c3e'),roughness:.7,metalness:.4,emissive:col('#3a3c3e'),emissiveIntensity:.15});walls.push(pur);
  for(let i=-3;i<=3;i++){const b=new T.Mesh(new T.BoxGeometry(18,.08,.14),pur);b.position.set(0,5.05,i*2.2);scene.add(b);}

  // LED tubes: bright core + soft glow shell (fresnel fade, so it reads as glow from any angle)
  const glowVS='varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}';
  const glowFS='uniform vec3 uC;uniform float uK;varying vec3 vN;varying vec3 vV;void main(){float f=abs(dot(normalize(vN),normalize(vV)));gl_FragColor=vec4(uC*uK*pow(f,3.0),1.);}';
  const seg=(a,b,r,m,parent)=>{const A=new T.Vector3(...a),B=new T.Vector3(...b),L=A.distanceTo(B);
    const g=new T.CylinderGeometry(r,r,L,12,1,true);const o=new T.Mesh(g,m);o.position.copy(A).add(B).multiplyScalar(.5);
    o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),B.clone().sub(A).normalize());parent.add(o);return o;};
  const segs=[];
  const arches=ARCH_X.map((x,ai)=>{
    const g=new T.Group();
    const caps=new T.MeshStandardMaterial({color:col('#111214'),roughness:.5,metalness:.6});
    for(let i=0;i<PROFILE.length-1;i++){const a=[x,PROFILE[i][1],PROFILE[i][0]],b=[x,PROFILE[i+1][1],PROFILE[i+1][0]];
      const core=new T.MeshBasicMaterial({color:col(TUBE),toneMapped:false,transparent:true});
      const glowM=new T.ShaderMaterial({vertexShader:glowVS,fragmentShader:glowFS,transparent:true,depthWrite:false,blending:T.AdditiveBlending,
        uniforms:{uC:{value:col('#8fdcff')},uK:{value:.3}}});
      const m=seg(a,b,.02,core,g);seg(a,b,.055,glowM,g).renderOrder=4;
      segs.push({ai,core,glowM,c:m.position.clone(),f:1});}
    [[x,.03,-2.25],[x,.03,2.25]].forEach(p=>{const f=new T.Mesh(new T.CylinderGeometry(.06,.07,.06,16),caps);f.position.set(...p);g.add(f);});
    scene.add(g);return {lvl:0};
  });

  // reflections: an environment made of the same tunnel, all lit, so the paint shows the light stripes
  const env=new T.Scene();
  env.add(new T.Mesh(new T.SphereGeometry(30,32,16),new T.MeshBasicMaterial({color:new T.Color(.012,.013,.014),side:T.BackSide})));
  const envFloor=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshBasicMaterial({color:new T.Color(.035,.035,.033)}));envFloor.rotation.x=-PI/2;envFloor.position.y=-.9;env.add(envFloor);
  const envWall=new T.Mesh(new T.PlaneGeometry(20,6),new T.MeshBasicMaterial({color:new T.Color(.09,.088,.08)}));envWall.position.set(-8.6,1.7,0);envWall.rotation.y=PI/2;env.add(envWall);
  const envTube=new T.MeshBasicMaterial({color:new T.Color(5,5.6,6)});
  ARCH_X.forEach(x=>{for(let i=0;i<PROFILE.length-1;i++)seg([x,PROFILE[i][1]-.9,PROFILE[i][0]],[x,PROFILE[i+1][1]-.9,PROFILE[i+1][0]],.05,envTube,env);});
  const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(env,0.012).texture;

  // soft contact shadow under the ute
  (function(){const W=1024,H=512,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    const rr=(w,h,r)=>{const x=(W-w)/2,y=(H-h)/2;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();};
    for(let i=0;i<40;i++){const k=i/39;g.fillStyle='rgba(0,0,0,'+(0.03+0.012*k)+')';rr(980-k*230,440-k*190,200-k*120);}
    for(let i=0;i<24;i++){g.fillStyle='rgba(0,0,0,0.05)';rr(760-i/23*80,250-i/23*60,70);}
    const m=new T.Mesh(new T.PlaneGeometry(7.0,3.4),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false,opacity:.95}));
    m.rotation.x=-PI/2;m.position.set(0,0.006,0);m.renderOrder=-1;scene.add(m);})();

  const base=new T.Color(TUBE).convertSRGBToLinear();
  function paint(sg){const v=arches[sg.ai].lvl;sg.core.color.copy(base).multiplyScalar(.04+.96*v);sg.core.opacity=sg.f;sg.glowM.uniforms.uK.value=.3*v*sg.f;}
  function setArch(i,v){arches[i].lvl=v;segs.forEach(sg=>{if(sg.ai===i)paint(sg);});}
  // tubes between the camera and the car fade to a ghost, so they never block the panel you're looking at
  function fade(cam,target){const dt=cam.position.distanceTo(target);
    segs.forEach(sg=>{const dc=cam.position.distanceTo(sg.c);const f=Math.min(1,Math.max(.12,(dc-(dt-2.4))/1.6));
      if(Math.abs(f-sg.f)>.01){sg.f=f;paint(sg);}});}
  function setRoom(v){walls.forEach(m=>{if(m.userData.e==null)m.userData.e=m.emissiveIntensity;m.emissiveIntensity=m.userData.e*v;});}
  return {arches,setArch,setRoom,fade,count:ARCH_X.length};
}

/* ---------- intro sounds (made in code, no music files) ---------- */
const SFX={ac:null,master:null,muted:false,hum:null,
  init(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ac=new AC();this.master=this.ac.createGain();this.master.gain.value=.9;this.master.connect(this.ac.destination);}catch(e){}},
  noise(d){const ac=this.ac,b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;return s;},
  clunk(){if(!this.ac)return;const ac=this.ac,t=ac.currentTime;
    const n=this.noise(.12),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.value=420;g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);n.connect(f).connect(g).connect(this.master);n.start(t);
    const o=ac.createOscillator(),og=ac.createGain();o.type='square';o.frequency.setValueAtTime(2400,t);og.gain.setValueAtTime(.05,t);og.gain.exponentialRampToValueAtTime(.001,t+.025);o.connect(og).connect(this.master);o.start(t);o.stop(t+.03);
    const b=ac.createOscillator(),bg=ac.createGain();b.type='sine';b.frequency.setValueAtTime(95,t);b.frequency.exponentialRampToValueAtTime(48,t+.18);bg.gain.setValueAtTime(.35,t);bg.gain.exponentialRampToValueAtTime(.001,t+.2);b.connect(bg).connect(this.master);b.start(t);b.stop(t+.22);},
  humOn(){if(!this.ac||this.hum)return;const ac=this.ac,t=ac.currentTime,g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=260;g.gain.value=0;
    const o1=ac.createOscillator(),o2=ac.createOscillator();o1.type='sawtooth';o1.frequency.value=100;o2.type='sine';o2.frequency.value=50;o1.connect(f);o2.connect(f);f.connect(g).connect(this.master);o1.start();o2.start();this.hum={g,o1,o2};},
  humTo(v,d){if(this.hum)this.hum.g.gain.linearRampToValueAtTime(v,this.ac.currentTime+(d||.1));},
  humOff(){if(!this.hum)return;const h=this.hum,t=this.ac.currentTime;h.g.gain.cancelScheduledValues(t);h.g.gain.setValueAtTime(h.g.gain.value,t);h.g.gain.linearRampToValueAtTime(0,t+1.2);h.o1.stop(t+1.3);h.o2.stop(t+1.3);this.hum=null;},
  whoosh(d){if(!this.ac)return;const ac=this.ac,t=ac.currentTime,n=this.noise(d),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.Q.value=1.4;
    f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(1600,t+d*.55);f.frequency.exponentialRampToValueAtTime(300,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+d*.5);g.gain.linearRampToValueAtTime(0,t+d);n.connect(f).connect(g).connect(this.master);n.start(t);},
  shimmer(){if(!this.ac)return;const ac=this.ac,t=ac.currentTime;[523.25,659.25,987.77].forEach((fq,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fq;
    g.gain.setValueAtTime(0,t+i*.06);g.gain.linearRampToValueAtTime(.05,t+i*.06+.05);g.gain.exponentialRampToValueAtTime(.001,t+i*.06+1.4);o.connect(g).connect(this.master);o.start(t+i*.06);o.stop(t+i*.06+1.5);});},
  mute(m){this.muted=m;if(this.master)this.master.gain.value=m?0:.9;}

/* ---------- tap to load: nothing heavy downloads until the visitor asks for 3D ---------- */
const LIBS=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js'];
function loadScript(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
let started=false;
async function start3D(){
  if(started)return;started=true;
  const app=document.querySelector('.app');app.classList.add('live');
  if(BRAND.studio==='tunnel')SFX.init();
  const L=document.getElementById('loading');L.hidden=false;L.textContent='Loading 3D…';
  try{for(const u of (window.PPF_LIBS||LIBS))await loadScript(u);}catch(e){L.textContent='Couldn’t load the 3D viewer. Check your connection and try again.';started=false;app.classList.remove('live');return;}
  boot();
}
document.getElementById('go3d').addEventListener('click',start3D);
document.getElementById('stage').addEventListener('click',e=>{if(!started&&e.target.closest('.poster'))start3D();});
if(/[?&]auto=1/.test(location.search)||!document.querySelector('.poster'))start3D();
if(window.parent!==window){const send=()=>window.parent.postMessage({fusion3dHeight:Math.ceil(document.querySelector('.app').getBoundingClientRect().height)},'*');
  new ResizeObserver(send).observe(document.querySelector('.app'));window.addEventListener('load',send);send();document.documentElement.classList.add('embedded');}
</script>
</body>
</html>
